apis:
- name: Towns Protocol
  description: >-
    Towns Protocol is an open, decentralized messaging protocol built on Base.
    Builders integrate via first-party TypeScript SDKs, a React SDK of hooks,
    and a bot/app framework. Under the hood the network exposes a Connect/gRPC
    Stream RPC service (StreamService, AppRegistryService, AuthenticationService)
    defined in public protobuf files, with end-to-end encrypted message streams
    carried by Stream Nodes and spaces/memberships/entitlements enforced by
    on-chain smart contracts.
