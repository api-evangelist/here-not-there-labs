aid: here-not-there-labs
name: Here Not There Labs
description: >-
  Here Not There Labs (Here Not There, Inc., operating as hntlabs.com) is the
  a16z-backed company behind Towns Protocol, an open, decentralized messaging
  protocol built on Base (an Ethereum L2) that powers ownable, programmable
  group chat spaces, memberships, direct messages, and decentralized finance.
  The protocol is delivered to builders as a set of first-party TypeScript
  packages under the @towns-protocol npm scope (client SDK, React SDK, bot
  framework, encryption, and generated protobuf bindings), a Connect/gRPC Stream
  RPC surface defined in public .proto files, a bot/app framework with a
  webhook-driven event model, and end-to-end message encryption. Spaces,
  memberships, roles, and entitlements are enforced by on-chain smart contracts,
  and a network of Stream Nodes run by node operators carries encrypted message
  streams. This profile was surfaced as an a16z portfolio lead and enriched from
  the company's public developer surface (docs.towns.com, app.towns.com, the
  towns-protocol GitHub organization, and npm).
